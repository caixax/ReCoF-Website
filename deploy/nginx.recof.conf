# recof.dev nginx server blocks.
# Loopback only: the Cloudflare Tunnel (cloudflared) points at 127.0.0.1:5780, nothing else reaches nginx.
# Serves the built site from /var/www/recof. There is no backend.
#
# The canonical host is recof.dev; www.recof.dev is a permanent redirect to it (second block).
#
# Install: copy to /etc/nginx/sites-enabled/recof, publish the build to /var/www/recof
# (rsync -a --delete dist/ /var/www/recof/), then: nginx -t && systemctl reload nginx.
# scripts/update.sh does all of it.

server {
    listen 127.0.0.1:5780;
    server_name recof.dev;
    root /var/www/recof;
    index index.html;

    server_tokens off;
    # /docs/install redirects to /docs/install/ with a relative Location, as nginx only sees
    # http on 127.0.0.1:5780 and an absolute one would send the browser there
    absolute_redirect off;
    client_max_body_size 1k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The pages load their own stylesheet and script, the release badges from shields.io, and the GameBanana
    # (which redirects to images.gamebanana.com) and ModDB badges in the footer.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://img.shields.io https://gamebanana.com https://images.gamebanana.com https://button.moddb.com; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # A static site takes GET and HEAD only.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ~ /\. {
        deny all;
    }

    # The stylesheet and the script are linked with a hash of their content (?v=...), so they can be kept a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The icons, the logo and the social preview: kept a day.
    location ~ ^/(favicon\.ico|favicon-32\.png|apple-touch-icon\.png|og\.png|img/) {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages: always checked again, so a new version shows at once (Cloudflare and the browser revalidate).
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://img.shields.io https://gamebanana.com https://images.gamebanana.com https://button.moddb.com; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://img.shields.io https://gamebanana.com https://images.gamebanana.com https://button.moddb.com; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    }
}

server {
    listen 127.0.0.1:5780;
    server_name www.recof.dev;
    server_tokens off;
    return 301 https://recof.dev$request_uri;
}
